server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: Authorization,Content-Type
            allow-credentials: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: item-service
          uri: lb://ITEM-SERVICE
          predicates:
            - Path=/api/v1/items/**
        - id: matching-service
          uri: lb://MATCHING-SERVICE
          predicates:
            - Path=/api/v1/matches/**
        - id: claim-service
          uri: lb://CLAIM-SERVICE
          predicates:
            - Path=/api/v1/claims/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app:
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
